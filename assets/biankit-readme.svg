<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">BianKit</title>
  <desc id="desc">Pequenas ferramentas portáteis para organizar documentos, escritório e aulas.</desc>
  <rect width="1200" height="390" rx="30" fill="#f4f1eb"/>
  <rect x="26" y="26" width="1148" height="338" rx="25" fill="#fffdf9" stroke="#ded9d1" stroke-width="2"/>

  <g transform="translate(76 70)">
    <rect x="0" y="18" width="59" height="75" rx="10" fill="#fffdf9" stroke="#24211f" stroke-width="6" transform="rotate(-8 29 55)"/>
    <rect x="21" y="9" width="59" height="75" rx="10" fill="#fffdf9" stroke="#24211f" stroke-width="6" transform="rotate(2 50 46)"/>
    <rect x="43" y="0" width="59" height="75" rx="10" fill="#fff0eb" stroke="#ff6b4a" stroke-width="6" transform="rotate(8 72 37)"/>
  </g>

  <text x="205" y="118" fill="#24211f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="63" font-weight="800" letter-spacing="-3">BianKit</text>
  <text x="78" y="210" fill="#24211f" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="750" letter-spacing="-1.2">Pequenas ferramentas. Uma rotina mais leve.</text>
  <text x="78" y="250" fill="#746f6a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">PDFs no lugar certo — sem menus demais e sem enviar documentos para a internet.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750">
    <rect x="78" y="292" width="174" height="48" rx="14" fill="#fff0eb" stroke="#ffb4a3"/>
    <g transform="translate(94 304)">
      <rect x="0" y="3" width="12" height="16" rx="3" fill="#fffdf9" stroke="#a43f29" stroke-width="2" transform="rotate(-7 6 11)"/>
      <rect x="7" y="0" width="12" height="18" rx="3" fill="#fff0eb" stroke="#ff6b4a" stroke-width="2"/>
    </g>
    <text x="122" y="323" fill="#a43f29">Juntar</text>

    <rect x="266" y="292" width="196" height="48" rx="14" fill="#f0edff" stroke="#c8bfff"/>
    <g transform="translate(282 307)">
      <rect x="0" y="0" width="22" height="6" rx="3" fill="#fffdf9" stroke="#563db9" stroke-width="2"/>
      <rect x="0" y="8" width="22" height="6" rx="3" fill="#f0edff" stroke="#7c5cff" stroke-width="2"/>
      <circle cx="5" cy="11" r="1.5" fill="#7c5cff"/>
    </g>
    <text x="310" y="323" fill="#563db9">Organizar</text>

    <rect x="476" y="292" width="174" height="48" rx="14" fill="#e7f7f2" stroke="#9edbc8"/>
    <g transform="translate(492 305)">
      <rect x="0" y="0" width="9" height="18" rx="3" fill="#e7f7f2" stroke="#19a67a" stroke-width="2"/>
      <rect x="13" y="0" width="9" height="18" rx="3" fill="#e7f7f2" stroke="#19a67a" stroke-width="2"/>
    </g>
    <text x="520" y="323" fill="#117154">Dividir</text>
  </g>

  <g transform="translate(846 72)">
    <rect x="30" y="32" width="194" height="238" rx="18" fill="#f7f4ee" stroke="#9edbc8" stroke-width="3" transform="rotate(8 127 151)"/>
    <rect x="14" y="17" width="194" height="238" rx="18" fill="#f7f4ee" stroke="#ffb4a3" stroke-width="3" transform="rotate(-5 111 136)"/>
    <rect x="0" y="0" width="194" height="238" rx="18" fill="#ffffff" stroke="#7c5cff" stroke-width="4"/>
    <rect x="25" y="28" width="105" height="13" rx="6" fill="#24211f" opacity=".86"/>
    <rect x="25" y="57" width="144" height="8" rx="4" fill="#ded9d1"/>
    <rect x="25" y="76" width="128" height="8" rx="4" fill="#ded9d1"/>
    <rect x="25" y="109" width="144" height="78" rx="10" fill="#f0edff"/>
    <circle cx="50" cy="212" r="11" fill="#7c5cff"/>
    <rect x="70" y="205" width="70" height="13" rx="6" fill="#7c5cff" opacity=".55"/>
  </g>
